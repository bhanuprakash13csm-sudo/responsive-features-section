<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>demo flexbox-responsive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="features-section">
        <div class="section-header">
            <h2>what type of dish you like?</h2>
            <p>the following dishes are available</p>
        </div>

        <!-- FLEXBOX CONTAINER -->
        <div class="features-grid">
            <!-- Feature 1 -->
            <div class="feature-box">
                <div class="icon-wrapper icon-blue">🍜</div>
                <h3>chinese</h3>
                <p>the chinese dishes like noodles,manchuria,fried rice</p>
            </div>

            <!-- Feature 2 -->
            <div class="feature-box">
                <div class="icon-wrapper icon-green">🍛</div>
                <h3>south indian meal</h3>
                <p>the south indian dishes like dosa, idli, sambar</p>
            </div>

            <!-- Feature 3 -->
            <div class="feature-box">
                <div class="icon-wrapper icon-purple">🍲</div>
                <h3>north indian meal</h3>
                <p>the north indian dishes like roti, curry, naan</p>
            </div>
        </div>
    </section>

</body>
</html>
